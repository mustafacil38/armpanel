<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArmPanel — Mobil Konsol</title>
    <meta name="description" content="ArmPanel: Termux/Debian için modern sunucu yönetim paneli">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h1>ArmPanel</h1>
                <p>Mobil Sunucu Yönetim Paneli</p>
            </div>
            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="login-username" placeholder="Kullanıcı Adı" required autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Şifre" required autocomplete="off">
                </div>
                <button type="submit" class="btn-login" id="login-btn">
                    <span>Giriş Yap</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p id="login-error" class="login-error"></p>
            </form>
        </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="app-shell hidden">
        <!-- Mobile Header -->
        <header class="top-bar">
            <button id="menu-toggle" class="menu-toggle" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="top-brand">
                <i class="fa-solid fa-shield-halved"></i>
                <span>ArmPanel</span>
            </div>
            <div class="top-right">
                <span id="top-username" class="top-username"></span>
                <button id="logout-btn" class="btn-icon" title="Çıkış">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="sb-logo"><i class="fa-solid fa-shield-halved"></i></div>
                <span>ArmPanel</span>
            </div>
            <ul class="sidebar-nav">
                <li>
                    <a href="#/dashboard" class="nav-link" data-page="dashboard">
                        <i class="fa-solid fa-gauge-high"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#/services" class="nav-link" data-page="services">
                        <i class="fa-solid fa-cubes"></i>
                        <span>Servisler</span>
                    </a>
                </li>
                <li>
                    <a href="#/installer" class="nav-link" data-page="installer">
                        <i class="fa-solid fa-download"></i>
                        <span>Yükleyici</span>
                    </a>
                </li>
                <li>
                    <a href="#/settings" class="nav-link" data-page="settings">
                        <i class="fa-solid fa-gear"></i>
                        <span>Ayarlar</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <span>v1.0.0</span>
            </div>
        </nav>

        <!-- Sidebar Overlay (mobile) -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Dynamic page content loaded here -->
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-box" class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" class="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/services.js"></script>
    <script src="/static/js/installer.js"></script>
    <script src="/static/js/settings.js"></script>
</body>

</html>
